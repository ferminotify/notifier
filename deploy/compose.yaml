# Production compose for Fermi Notify Notifier
# This file lives in deploy/ — .env is expected one level up (../env)
# On server: DEPLOY_PATH/deploy/compose.yaml, DEPLOY_PATH/.env

services:
  notifier:
    image: ghcr.io/ferminotify/notifier:latest
    container_name: fn-notifier
    env_file:
      - ../.env
    restart: unless-stopped
